name: FLOCH3 Android APK

on:
  push:
    branches:
      - main
      - feature/floch3-webview-app
    paths:
      - "app/**"
      - "*.gradle"
      - "gradle.properties"
      - ".github/workflows/floch3-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: floch3-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FLOCH3 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLOCH3-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
