<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#0D1017" id="metaTheme">

<link rel="manifest" id="manifest">
<link rel="preconnect" href="https://fonts.googleapis.com">

<title>SpaedrNG — فروشگاه نرم‌افزار</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}

:root{
  --bg:#0D1017; --surface:#171C26; --surface-2:#202736; --surface-3:#2a3242;
  --border:#232b3a; --border-2:#2e3849;
  --text:#F4F6FA; --text-dim:#98a2b3; --text-mute:#6b7689;
  --accent:#C49A6C; --accent-h:#d4ab7d; --accent-fg:#1a1208;
  --success:#4ade80; --danger:#f87171; --warning:#fbbf24; --info:#60a5fa;
  --r:14px; --r-sm:10px; --r-lg:20px; --r-full:999px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --shadow-sm:0 4px 12px rgba(0,0,0,.25);
  --t:.18s ease;
}
[data-theme="light"]{
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#eef1f6; --surface-3:#e2e7ef;
  --border:#e0e5ee; --border-2:#cfd6e2;
  --text:#11151c; --text-dim:#4a5567; --text-mute:#6b7689;
  --accent:#a97a45; --accent-h:#8a6236; --accent-fg:#ffffff;
  --shadow:0 10px 30px rgba(20,30,60,.08);
  --shadow-sm:0 4px 12px rgba(20,30,60,.06);
}
body{
  background:var(--bg); color:var(--text);
  font-family:"Vazirmatn","Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.7; min-height:100vh;
  transition:background var(--t),color var(--t);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button:focus,a:focus,input:focus,select:focus{outline:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;
}
svg{display:block}

/* Header */
.app-header{
  position:sticky; top:0; z-index:50;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(140%) blur(14px);
  -webkit-backdrop-filter:saturate(140%) blur(14px);
  border-bottom:1px solid var(--border);
}
.header-inner{
  max-width:1200px; margin:0 auto;
  padding:12px 20px;
  display:flex; align-items:center; gap:12px;
}
.logo{
  display:flex; align-items:center; gap:10px;
  font-weight:700; font-size:18px; color:var(--text);
  text-decoration:none; flex-shrink:0;
}
.logo-mark{
  width:34px; height:34px; border-radius:10px;
  background:linear-gradient(135deg,var(--accent),#8a6236);
  display:grid; place-items:center; color:var(--accent-fg);
  font-weight:800; font-size:16px;
  box-shadow:0 4px 14px rgba(196,154,108,.35);
}
.search-wrap{flex:1; position:relative; min-width:0}
.search-wrap > svg{
  position:absolute; inset-inline-start:14px; top:50%; transform:translateY(-50%);
  width:16px; height:16px; color:var(--text-mute); pointer-events:none;
}
#search{
  width:100%; height:42px; padding:0 42px 0 42px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-full); color:var(--text);
  font:inherit; font-size:14px;
  transition:border-color var(--t),background var(--t);
}
#search:focus{border-color:var(--accent); background:var(--surface-2)}
#search::placeholder{color:var(--text-mute)}
.icon-btn{
  width:42px; height:42px; flex-shrink:0;
  display:grid; place-items:center;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-full); color:var(--text-dim); cursor:pointer;
  transition:all var(--t);
}
.icon-btn:hover{color:var(--text); background:var(--surface-2); border-color:var(--border-2)}
.icon-btn svg{width:18px; height:18px}

/* Toolbar */
.toolbar{
  max-width:1200px; margin:0 auto;
  padding:16px 20px 4px;
  display:flex; gap:8px; flex-wrap:wrap; align-items:center;
}
.chips{
  display:flex; gap:8px; overflow-x:auto;
  padding-bottom:4px; flex:1; min-width:0;
  scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;
  padding:6px 14px; border-radius:var(--r-full);
  background:var(--surface); border:1px solid var(--border);
  color:var(--text-dim); cursor:pointer;
  font:inherit; font-size:13px; font-weight:500;
  transition:all var(--t); white-space:nowrap;
}
.chip:hover{color:var(--text); border-color:var(--border-2)}
.chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-fg)}
select.chip{
  appearance:none; -webkit-appearance:none;
  padding-inline-end:28px; cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' fill='none' stroke='%2398a2b3' stroke-width='1.5'><path d='M3 5l3 3 3-3'/></svg>");
  background-repeat:no-repeat;
  background-position:left 10px center;
  background-size:12px;
}
[data-theme="light"] select.chip{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' fill='none' stroke='%234a5567' stroke-width='1.5'><path d='M3 5l3 3 3-3'/></svg>");
}

/* Grid */
.grid{
  max-width:1200px; margin:0 auto;
  padding:20px;
  display:grid; gap:16px;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  animation:fadeIn .25s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none}}

.card{
  position:relative; overflow:hidden;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-lg); padding:18px;
  display:flex; flex-direction:column; gap:12px;
  cursor:pointer;
  transition:transform var(--t),border-color var(--t),box-shadow var(--t);
}
.card:hover{transform:translateY(-3px); border-color:var(--border-2); box-shadow:var(--shadow)}
.card-head{display:flex; align-items:center; gap:12px}
.card-icon{
  width:52px; height:52px; flex-shrink:0; border-radius:14px;
  display:grid; place-items:center; font-size:24px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 25%,var(--surface-2)),var(--surface-2));
  border:1px solid var(--border-2);
}
.card-titles{min-width:0; flex:1}
.card-name{
  font-size:15px; font-weight:600; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.card-dev{
  font-size:12.5px; color:var(--text-mute);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.card-tagline{
  font-size:13.5px; color:var(--text-dim); line-height:1.65; margin:0;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; min-height:2.6em;
}
.card-foot{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  margin-top:auto; padding-top:12px; border-top:1px solid var(--border);
}
.meta-pill{
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 9px; border-radius:var(--r-full);
  background:var(--surface-2); border:1px solid var(--border);
  font-size:11.5px; color:var(--text-dim); font-weight:500;
}
.meta-pill svg{width:11px; height:11px}
.meta-pill.accent{
  color:var(--accent);
  border-color:color-mix(in srgb,var(--accent) 35%,var(--border));
  background:color-mix(in srgb,var(--accent) 10%,var(--surface-2));
}
.fav-btn{
  position:absolute; top:14px; inset-inline-end:14px;
  width:32px; height:32px;
  display:grid; place-items:center; border-radius:var(--r-full);
  background:color-mix(in srgb,var(--surface) 70%,transparent);
  backdrop-filter:blur(8px);
  border:1px solid var(--border);
  color:var(--text-mute); cursor:pointer;
  transition:all var(--t); z-index:2;
}
.fav-btn:hover{color:var(--accent); border-color:var(--accent)}
.fav-btn.active{
  color:var(--accent);
  background:color-mix(in srgb,var(--accent) 15%,var(--surface));
  border-color:var(--accent);
}
.fav-btn svg{width:15px; height:15px}

/* Details */
.details{
  max-width:920px; margin:0 auto; padding:20px;
  animation:fadeIn .25s ease;
}
.back-btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:8px 14px; border-radius:var(--r-full);
  background:var(--surface); border:1px solid var(--border);
  color:var(--text-dim); cursor:pointer;
  font:inherit; font-size:13.5px; font-weight:500;
  transition:all var(--t); margin-bottom:16px;
}
.back-btn:hover{color:var(--text); border-color:var(--border-2); background:var(--surface-2)}
.back-btn svg{width:14px; height:14px}
.details-hero{
  display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap;
  padding:22px; border-radius:var(--r-lg);
  background:linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid var(--border);
}
.details-icon{
  width:84px; height:84px; border-radius:22px; flex-shrink:0;
  display:grid; place-items:center; font-size:40px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 30%,var(--surface-2)),var(--surface-2));
  border:1px solid var(--border-2);
}
.details-titles{flex:1; min-width:220px}
.details-name{font-size:22px; font-weight:700; margin:0 0 4px}
.details-dev{font-size:13.5px; color:var(--text-mute); margin-bottom:8px}
.details-tagline{font-size:14px; color:var(--text-dim); line-height:1.7; margin:0}
.details-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:10px 18px; border-radius:var(--r-full);
  font:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
  border:1px solid transparent; transition:all var(--t);
  text-decoration:none; white-space:nowrap;
}
.btn svg{width:15px; height:15px}
.btn-primary{background:var(--accent); color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent-h); transform:translateY(-1px); box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn-secondary{background:var(--surface-2); border-color:var(--border); color:var(--text)}
.btn-secondary:hover{border-color:var(--border-2); background:var(--surface-3)}
.btn-ghost{background:transparent; color:var(--text-dim); border-color:var(--border)}
.btn-ghost:hover{color:var(--text); border-color:var(--border-2)}

.section{margin-top:24px}
.section-title{
  font-size:15px; font-weight:600; margin:0 0 12px;
  display:flex; align-items:center; gap:8px;
}
.section-title svg{width:16px; height:16px; color:var(--accent)}

.meta-grid{
  display:grid; gap:10px;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
}
.meta-card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r); padding:12px 14px;
}
.meta-label{font-size:11.5px; color:var(--text-mute); margin-bottom:4px}
.meta-value{font-size:14px; font-weight:600; color:var(--text)}

.features{list-style:none; padding:0; margin:0; display:grid; gap:8px}
.features li{
  display:flex; gap:10px; align-items:flex-start;
  padding:10px 14px; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r);
  font-size:13.5px; color:var(--text-dim);
}
.features li::before{
  content:""; flex-shrink:0; width:18px; height:18px;
  border-radius:50%; margin-top:2px;
  background-color:color-mix(in srgb,var(--success) 20%,transparent);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234ade80' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6L9 17l-5-5'/></svg>");
  background-size:12px; background-position:center; background-repeat:no-repeat;
}

.downloads{display:grid; gap:8px}
.dl-row{
  display:flex; align-items:center; gap:12px;
  padding:12px 14px; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r);
  transition:border-color var(--t),background var(--t);
  flex-wrap:wrap;
}
.dl-row:hover{border-color:var(--border-2); background:var(--surface-2)}
.dl-icon{
  width:38px; height:38px; flex-shrink:0; border-radius:10px;
  display:grid; place-items:center;
  background:color-mix(in srgb,var(--accent) 12%,var(--surface-2));
  border:1px solid var(--border); color:var(--accent);
}
.dl-icon svg{width:17px; height:17px}
.dl-info{flex:1; min-width:180px}
.dl-name{font-size:13.5px; font-weight:600; color:var(--text); margin-bottom:2px; word-break:break-all}
.dl-meta{font-size:11.5px; color:var(--text-mute); display:flex; gap:10px; flex-wrap:wrap}
.dl-badge{
  display:inline-flex; align-items:center; gap:4px;
  font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:var(--r-full);
}
.dl-badge.verified{background:color-mix(in srgb,var(--success) 15%,transparent); color:var(--success)}
.dl-badge.unverified{background:color-mix(in srgb,var(--warning) 15%,transparent); color:var(--warning)}
.dl-badge svg{width:10px; height:10px}

.empty{
  text-align:center; padding:60px 20px; color:var(--text-mute);
  max-width:1200px; margin:0 auto;
}
.empty svg{width:48px; height:48px; margin:0 auto 12px; opacity:.4}
.empty h3{margin:0 0 6px; color:var(--text-dim); font-weight:600; font-size:16px}
.empty p{margin:0; font-size:13.5px}

.skeleton{
  background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite linear;
  border-radius:var(--r-sm);
}
@keyframes shimmer{to{background-position:-200% 0}}

.toast-wrap{
  position:fixed; bottom:20px; inset-inline-start:20px;
  z-index:200; display:flex; flex-direction:column; gap:8px;
  pointer-events:none;
}
.toast{
  padding:12px 18px; border-radius:var(--r);
  background:var(--surface-2); border:1px solid var(--border-2);
  color:var(--text); font-size:13px; font-weight:500;
  box-shadow:var(--shadow);
  animation:slideUp .2s ease;
  pointer-events:auto;
}
.toast.error{border-color:color-mix(in srgb,var(--danger) 50%,var(--border))}
.toast.success{border-color:color-mix(in srgb,var(--success) 50%,var(--border))}
@keyframes slideUp{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}

@media (max-width:640px){
  .header-inner{padding:10px 14px; gap:10px}
  .logo-text{display:none}
  .toolbar{padding:12px 14px 4px}
  .grid{padding:14px; gap:12px; grid-template-columns:1fr}
  .details{padding:14px}
  .details-hero{padding:16px; gap:14px}
  .details-icon{width:64px; height:64px; font-size:32px; border-radius:18px}
  .details-name{font-size:19px}
  .meta-grid{grid-template-columns:repeat(2,1fr)}
  .details-actions .btn{flex:1; justify-content:center}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
</style>
</head>

</header>

<main id="app" role="main"></main>

function loadJSON(k, fb){ try { const v = JSON.parse(localStorage.getItem(k)); return v ?? fb; } catch { return fb; } }
function saveJSON(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

   4) ابزارها
   ============================================================ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtDate(iso){
  if (!iso) return '—';
  try {
    return new Intl.DateTimeFormat('fa-IR', {year:'numeric', month:'short', day:'numeric'}).format(new Date(iso));
  } catch { return iso; }
}
function formatBytes(b){
  if (b == null) return '';
  const u = ['B','KB','MB','GB'];
  let i = 0, n = b;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  const digits = n < 10 && i > 0 ? 1 : 0;
  return `${n.toFixed(digits)} ${u[i]}`;
}
function parseArch(name){
  const s = String(name).toLowerCase();
  if (/arm64|aarch64/.test(s)) return 'arm64-v8a';
  if (/armeabi|armv7/.test(s)) return 'armeabi-v7a';
  if (/x86_64/.test(s))        return 'x86_64';
  if (/\bx86\b/.test(s))       return 'x86';
  if (/universal/.test(s))     return 'universal';
  return '';
}
function compareVersions(a, b){
  const pa = String(a).split(/[.\-+_]/).map(x => /^\d+$/.test(x) ? +x : x);
  const pb = String(b).split(/[.\-+_]/).map(x => /^\d+$/.test(x) ? +x : x);
  const len = Math.max(pa.length, pb.length);
  for (let i = 0; i < len; i++){
    const x = pa[i] ?? 0, y = pb[i] ?? 0;
    if (x === y) continue;
    return x > y ? 1 : -1;
  }
  return 0;
}

function toast(msg, type='info', ms=2400){
  const wrap = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = `toast ${type}`;

}

/* ============================================================
   6) GitHub Releases + کش
   ============================================================ */
const releaseCache = new Map();
const RELEASE_TTL = 60 * 60 * 1000; // 1 ساعت

async function getLatestRelease(repo){
  if (!repo) return null;
  if (releaseCache.has(repo)) return releaseCache.get(repo);

  const key = `spaedr:rel:${repo}`;
  const cached = loadJSON(key, null);
  if (cached && Date.now() - cached.ts < RELEASE_TTL){
    releaseCache.set(repo, cached.data);
    return cached.data;
  }

  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 8000);
    const res = await fetch(`https://api.github.com/repos/${repo}/releases/latest`, {
      headers: { 'Accept':'application/vnd.github+json' },
      signal: controller.signal,
    });
    clearTimeout(timer);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    releaseCache.set(repo, data);
    saveJSON(key, { ts: Date.now(), data });
    return data;
  } catch (e) {
    return null;
  }
}

/* ============================================================
   7) ساخت لینک‌های دانلود
   ============================================================ */
function buildDownloads(app, release){
  const list = [];

  if (release && Array.isArray(release.assets)) {
    for (const a of release.assets){
      if (/\.(apk|exe|dmg|zip|tar\.gz|deb|rpm|apks|aab)$/i.test(a.name) || !/\.(sha|sig|txt|md|json)$/i.test(a.name)) {
        list.push({
          name: a.name,
          url: a.browser_download_url,
          size: formatBytes(a.size),
          arch: parseArch(a.name),
          source: 'GitHub Releases',
          verified: true,
        });
      }
    }
  }

  if (!list.length && app.repo){
    list.push({
      name: 'صفحه رسمی Releases',
      url: `https://github.com/${app.repo}/releases`,
      size: '',
      arch: '',
      source: 'GitHub',
      verified: false,
    });
  }
  if (!list.length && app.homepage){
    list.push({
      name: 'صفحه رسمی برنامه',
      url: app.homepage,
      size: '',
      arch: '',
      source: 'وب‌سایت رسمی',
      verified: false,
    });
  }
  return list;
}

   ============================================================ */
function filterApps(){
  const q = state.search.trim().toLowerCase();
  let list = APPS.filter(a => {
    if (state.category !== 'all' && a.category !== state.category) return false;
    if (state.arch !== 'all' && !a.architectures.includes(state.arch)) return false;
    if (q){
      const hay = [a.name, a.developer, a.tagline, a.description, a.tags.join(' ')].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  switch (state.sort){
    case 'newest': list.sort((a,b) => (b.releasedAt || '').localeCompare(a.releasedAt || '')); break;
    case 'name':   list.sort((a,b) => a.name.localeCompare(b.name, 'fa')); break;
    case 'fav':    list = list.filter(a => state.favorites.has(a.id)); break;
    case 'featured':
    default:
      list.sort((a,b) => {
        const fa = state.favorites.has(a.id) ? 0 : 1;
        const fb = state.favorites.has(b.id) ? 0 : 1;
        return fa - fb;
      });
  }
  return list;
}

            <div class="meta-label">آخرین نسخه منتشرشده</div>
            <div class="meta-value">
              ${esc(latestVersion)}
              ${hasUpdate ? '<span style="color:var(--success);font-size:11px;font-weight:600"> • به‌روزرسانی موجود</span>' : ''}
            </div>
          </div>
          <div class="meta-card">
            <div class="meta-label">تاریخ انتشار</div>
            <div class="meta-value">${fmtDate(latestDate)}</div>
          </div>
          <div class="meta-card">
            <div class="meta-label">حجم</div>
            <div class="meta-value">${esc(app.size || '—')}</div>
          </div>
          <div class="meta-card">
            <div class="meta-label">دسته‌بندی</div>
            <div class="meta-value">${esc(catLabel(app.category))}</div>
          </div>
          <div class="meta-card">
            <div class="meta-label">معماری‌ها</div>
            <div class="meta-value" style="font-size:12px">
              ${app.architectures.length ? app.architectures.map(esc).join(' • ') : '—'}
            </div>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">${icon('check')} ویژگی‌ها</h2>
        <ul class="features">
          ${app.features.map(f => `<li>${esc(f)}</li>`).join('')}
        </ul>
      </section>

      <section class="section">
        <h2 class="section-title">${icon('download')} فایل‌های دانلود</h2>
        <div class="downloads">
          ${downloads.length
            ? downloads.map(renderDownload).join('')
            : `<div class="meta-card" style="text-align:center;color:var(--text-mute)">
                 فایل قابل دانلود مستقیمی برای این برنامه ثبت نشده است.
               </div>`}
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">${icon('tag')} برچسب‌ها</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${app.tags.map(t => `<span class="chip" style="cursor:default">#${esc(t)}</span>`).join('')}
        </div>
      </section>
    </div>
  `;

  document.getElementById('backBtn').addEventListener('click', closeDetails);
  document.getElementById('favBtn').addEventListener('click', () => {
    toggleFav(app.id);
    const now = state.favorites.has(app.id);
    const btn = document.getElementById('favBtn');
    btn.innerHTML = `${icon('heart')} ${now ? 'در علاقه‌مندی‌ها' : 'افزودن به علاقه‌مندی'}`;
    btn.setAttribute('aria-pressed', String(now));
    toast(now ? 'به علاقه‌مندی‌ها اضافه شد' : 'از علاقه‌مندی‌ها حذف شد', 'success', 1600);
  });
}

function renderDownload(d){
  return `
    <div class="dl-row">
      <div class="dl-icon" aria-hidden="true">${icon('download')}</div>
      <div class="dl-info">
        <div class="dl-name">${esc(d.name)}</div>
        <div class="dl-meta">
          ${d.arch   ? `<span>${esc(d.arch)}</span>` : ''}
          ${d.size   ? `<span>${esc(d.size)}</span>` : ''}
          ${d.source ? `<span>${esc(d.source)}</span>` : ''}
        </div>
      </div>
      <span class="dl-badge ${d.verified ? 'verified' : 'unverified'}">
        ${d.verified ? icon('check') + ' تأییدشده' : icon('alert') + ' تأییدنشده'}
      </span>
      <a class="btn btn-secondary" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">
        ${icon('download')} دریافت
      </a>
    </div>
  `;
}

/* ============================================================
   12) مسیریابی
   ============================================================ */
function openApp(id){
  state.cameFromStore = true;
  const url = new URL(location.href);
  url.searchParams.set('app', id);
  history.pushState({ view:'details', id }, '', url);
  renderRoute();
}

function closeDetails(){
  if (state.cameFromStore && history.length > 1){
    history.back(); // popstate → renderRoute
  } else {
    const url = new URL(location.href);
    url.searchParams.delete('app');
    history.replaceState({ view:'store' }, '', url);
    renderRoute();
  }
}

function renderRoute(){
  const appId = new URL(location.href).searchParams.get('app');
  const app = appId ? APPS.find(a => a.id === appId) : null;

  if (app){
    document.title = `${app.name} — SpaedrNG`;
    renderDetails(app);
  } else {
    state.cameFromStore = false;
    document.title = 'SpaedrNG — فروشگاه نرم‌افزار';
    renderStore();
  }
  window.scrollTo({ top:0, behavior:'auto' });
}

/* ============================================================
   13) تم
   ============================================================ */
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  const meta = document.getElementById('metaTheme');
  if (meta) meta.content = t === 'light' ? '#f4f6fa' : '#0D1017';
  const btn = document.getElementById('themeBtn');
  if (btn){
    btn.innerHTML = t === 'light' ? icon('moon') : icon('sun');
    btn.setAttribute('aria-label', t === 'light' ? 'فعال‌سازی تم تیره' : 'فعال‌سازی تم روشن');
  }
}

function toggleFav(id){
  if (state.favorites.has(id)) state.favorites.delete(id);
  else state.favorites.add(id);
  saveFavs();
}

/* ============================================================
   14) PWA Manifest
   ============================================================ */
function setupManifest(){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0D1017"/><text x="50%" y="54%" font-family="sans-serif" font-size="280" font-weight="800" fill="#C49A6C" text-anchor="middle" dominant-baseline="middle">S</text></svg>`;
  const iconUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));

  const manifest = {
    name: 'SpaedrNG',
    short_name: 'SpaedrNG',
    description: 'فروشگاه نرم‌افزارهای امن و متن‌باز',
    start_url: '.',
    scope: '.',
    display: 'standalone',
    background_color: '#0D1017',
    theme_color: '#0D1017',
    icons: [
      { src: iconUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' },
      { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' },
    ],
  };
  try {
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    document.getElementById('manifest').href = URL.createObjectURL(blob);
  } catch { /* noop */ }
}

/* ============================================================
   15) راه‌اندازی
   ============================================================ */
function init(){
  // تم
  const savedTheme = localStorage.getItem('spaedr:theme');
  const prefersLight = window.matchMedia?.('(prefers-color-scheme: light)').matches;
  applyTheme(savedTheme || (prefersLight ? 'light' : 'dark'));

  document.getElementById('themeBtn').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    applyTheme(next);
    localStorage.setItem('spaedr:theme', next);
  });

  // جستجو با debounce
  const searchInput = document.getElementById('search');
  let searchTimer;
  searchInput.addEventListener('input', e => {
    clearTimeout(searchTimer);
    const v = e.target.value;
    searchTimer = setTimeout(() => {
      state.search = v;
      if (!new URL(location.href).searchParams.get('app')) renderStore();
      else renderStore();
    }, 140);
  });

  // رویدادهای سراسری
  document.addEventListener('click', e => {
    const favBtn = e.target.closest('[data-fav]');
    if (favBtn){
      e.stopPropagation();
      e.preventDefault();
      const id = favBtn.dataset.fav;
      toggleFav(id);
      favBtn.classList.toggle('active');
      toast(state.favorites.has(id) ? 'به علاقه‌مندی‌ها اضافه شد' : 'از علاقه‌مندی‌ها حذف شد', 'success', 1400);
      return;
    }

    const card = e.target.closest('.card');
    if (card){
      openApp(card.dataset.id);
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){
      const card = e.target.closest?.('.card');
      if (card){ e.preventDefault(); openApp(card.dataset.id); }
    }
    if (e.key === 'Escape'){
      if (new URL(location.href).searchParams.get('app')) closeDetails();
    }
  });

  // مسیر اولیه: اگر کاربر مستقیم روی ?app=id وارد شد،
  // یک ورودی «فروشگاه» زیر آن می‌سازیم تا دکمه بازگشت درست کار کند.
  const initialApp = new URL(location.href).searchParams.get('app');
  if (initialApp && APPS.some(a => a.id === initialApp)){
    const cleanUrl = location.pathname + location.hash;
    history.replaceState({ view:'details', id: initialApp }, '', location.href);
    history.pushState({ view:'store' }, '', cleanUrl);
    history.pushState({ view:'details', id: initialApp }, '', location.href);
    history.go(-1);
  }

  window.addEventListener('popstate', renderRoute);

  setupManifest();
  renderRoute();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
