<title>SpaedrNG — فروشگاه نرم‌افزار</title>
<style>
/* ============================================================
   DESIGN TOKENS — توکن‌های طراحی
   ============================================================ */
:root{
  /* Spacing scale */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px;

  /* Type scale */
  --fs-xs:11px; --fs-sm:12.5px; --fs-base:14px; --fs-md:15px;
  --fs-lg:17px; --fs-xl:20px; --fs-2xl:24px; --fs-3xl:30px;

  /* Radius */
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:24px;
  --r-2xl:28px; --r-full:999px;

  /* Colors — Dark theme (default) */
  --bg:#0B0E14;
  --bg-elev:#11151F;
  --surface:#161B27;
  --surface-2:#1E2433;
  --surface-3:#262E40;
  --surface-hover:#2B344A;
  --border:#222A3B;
  --border-2:#2E3850;
  --border-strong:#3A4762;

  --text:#F5F7FA;
  --text-dim:#9BA6BA;
  --text-mute:#6B7793;

  --accent:#C49A6C;
  --accent-h:#D4AB7D;
  --accent-fg:#1A1208;
  --accent-soft:rgba(196,154,108,.12);
  --accent-glow:rgba(196,154,108,.3);

  --success:#4ADE80;
  --success-soft:rgba(74,222,128,.14);
  --danger:#F87171;
  --danger-soft:rgba(248,113,113,.14);
  --warning:#FBBF24;
  --warning-soft:rgba(251,191,36,.14);
  --info:#60A5FA;
  --info-soft:rgba(96,165,250,.14);
  --purple:#A78BFA;
  --purple-soft:rgba(167,139,250,.14);

  /* Shadows */
  --shadow-xs:0 1px 2px rgba(0,0,0,.3);
  --shadow-sm:0 2px 8px rgba(0,0,0,.25);
  --shadow-md:0 6px 20px rgba(0,0,0,.35);
  --shadow-lg:0 16px 40px rgba(0,0,0,.45);
  --shadow-glow:0 0 0 1px var(--accent-glow), 0 8px 28px rgba(196,154,108,.25);

  /* Motion */
  --t-fast:.14s cubic-bezier(.4,0,.2,1);
  --t-base:.22s cubic-bezier(.4,0,.2,1);
  --t-slow:.35s cubic-bezier(.4,0,.2,1);

  /* Layout */
  --header-h:60px;
  --max-w:1280px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

[data-theme="light"]{
  --bg:#F5F7FB;
  --bg-elev:#FFFFFF;
  --surface:#FFFFFF;
  --surface-2:#F0F3F9;
  --surface-3:#E4E9F2;
  --surface-hover:#DDE4EF;
  --border:#E3E8F0;
  --border-2:#D2DAE7;
  --border-strong:#B9C3D4;

  --text:#0F141E;
  --text-dim:#4A5568;
  --text-mute:#7B8699;

  --accent:#A67A45;
  --accent-h:#8C6536;
  --accent-fg:#FFFFFF;
  --accent-soft:rgba(166,122,69,.1);
  --accent-glow:rgba(166,122,69,.25);

  --success:#16A34A;
  --success-soft:rgba(22,163,74,.1);
  --danger:#DC2626;
  --danger-soft:rgba(220,38,38,.1);
  --warning:#D97706;
  --warning-soft:rgba(217,119,6,.1);
  --info:#2563EB;
  --info-soft:rgba(37,99,235,.1);
  --purple:#7C3AED;
  --purple-soft:rgba(124,58,237,.1);

  --shadow-xs:0 1px 2px rgba(15,20,30,.04);
  --shadow-sm:0 2px 8px rgba(15,20,30,.06);
  --shadow-md:0 6px 20px rgba(15,20,30,.08);
  --shadow-lg:0 16px 40px rgba(15,20,30,.1);
}

/* ============================================================
   RESET
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--text);
  font-family:"Vazirmatn","Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;
  font-size:var(--fs-base); line-height:1.7;
  min-height:100vh; min-height:100dvh;
  transition:background var(--t-base), color var(--t-base);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
img,svg{display:block;max-width:100%}
button,a,input,select,textarea{outline:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-xs);
}
::selection{background:var(--accent-soft); color:var(--accent)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:var(--r-full)}
::-webkit-scrollbar-thumb:hover{background:var(--border-strong)}

/* ============================================================
   HEADER
   ============================================================ */
.app-header{
  position:sticky; top:0; z-index:60;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border);
  transition:background var(--t-base), border-color var(--t-base);
}
.header-inner{
  max-width:var(--max-w); margin:0 auto;
  padding:10px 16px;
  display:flex; align-items:center; gap:10px;
}
.logo{
  display:flex; align-items:center; gap:10px;
  font-weight:700; font-size:var(--fs-lg);
  flex-shrink:0;
}
.logo-mark{
  width:36px; height:36px; border-radius:11px;
  background:linear-gradient(135deg,var(--accent),#8A6236);
  display:grid; place-items:center;
  color:var(--accent-fg);
  font-weight:800; font-size:17px;
  box-shadow:0 4px 14px var(--accent-glow);
  flex-shrink:0;
}
.logo-text{display:none}
.search-wrap{flex:1; position:relative; min-width:0}
.search-wrap .search-icon{
  position:absolute; inset-inline-start:14px; top:50%;
  transform:translateY(-50%);
  width:16px; height:16px; color:var(--text-mute);
  pointer-events:none;
}
.search-clear{
  position:absolute; inset-inline-end:6px; top:50%;
  transform:translateY(-50%);
  width:28px; height:28px;
  display:none; place-items:center;
  background:transparent; border:0;
  color:var(--text-mute); cursor:pointer;
  border-radius:var(--r-full);
  transition:all var(--t-fast);
}
.search-clear:hover{color:var(--text); background:var(--surface-2)}
.search-clear svg{width:14px; height:14px}
.search-wrap.has-value .search-clear{display:grid}
#search{
  width:100%; height:40px;
  padding:0 40px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-full);
  color:var(--text); font:inherit; font-size:var(--fs-sm);
  transition:all var(--t-base);
}
#search:focus{
  border-color:var(--accent);
  background:var(--surface-2);
  box-shadow:0 0 0 3px var(--accent-soft);
}
#search::placeholder{color:var(--text-mute)}
.icon-btn{
  width:40px; height:40px; flex-shrink:0;
  display:grid; place-items:center;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-full);
  color:var(--text-dim); cursor:pointer;
  transition:all var(--t-base);
  position:relative;
}
.icon-btn:hover{
  color:var(--text);
  background:var(--surface-2);
  border-color:var(--border-2);
  transform:translateY(-1px);
}
.icon-btn:active{transform:translateY(0) scale(.96)}
.icon-btn svg{width:18px; height:18px}
.icon-btn .badge{
  position:absolute; top:-4px; inset-inline-end:-4px;
  min-width:18px; height:18px; padding:0 5px;
  background:var(--accent); color:var(--accent-fg);
  border-radius:var(--r-full);
  font-size:10px; font-weight:700;
  display:grid; place-items:center;
  border:2px solid var(--bg);
}

/* ============================================================
   TOOLBAR
   ============================================================ */
.toolbar{
  max-width:var(--max-w); margin:0 auto;
  padding:14px 16px 4px;
  display:flex; gap:10px; flex-wrap:wrap; align-items:center;
}
.chips{
  display:flex; gap:8px; overflow-x:auto;
  padding-bottom:4px; flex:1; min-width:0;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;
  padding:7px 14px; border-radius:var(--r-full);
  background:var(--surface); border:1px solid var(--border);
  color:var(--text-dim); cursor:pointer;
  font:inherit; font-size:var(--fs-sm); font-weight:500;
  transition:all var(--t-fast);
  white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.chip:hover{color:var(--text); border-color:var(--border-2); background:var(--surface-2)}
.chip:active{transform:scale(.96)}
.chip.active{
  background:var(--accent); border-color:var(--accent);
  color:var(--accent-fg);
  box-shadow:0 4px 14px var(--accent-glow);
}
select.chip{
  appearance:none; -webkit-appearance:none;
  padding-inline-end:30px;
  cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' fill='none' stroke='%239BA6BA' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M3 5l3 3 3-3'/></svg>");
  background-repeat:no-repeat;
  background-position:left 11px center;
  background-size:12px;
}
[data-theme="light"] select.chip{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' fill='none' stroke='%234A5568' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M3 5l3 3 3-3'/></svg>");
}

/* Mobile filter button */
.filter-btn{display:none}

/* ============================================================
   STATS BAR
   ============================================================ */
.stats-bar{
  max-width:var(--max-w); margin:0 auto;
  padding:8px 16px 0;
  display:flex; gap:8px; flex-wrap:wrap;
  font-size:var(--fs-xs); color:var(--text-mute);
}
.stat-chip{
  display:inline-flex; align-items:center; gap:5px;
  padding:4px 10px; border-radius:var(--r-full);
  background:var(--surface); border:1px solid var(--border);
}
.stat-chip strong{color:var(--text); font-weight:600}
.stat-chip svg{width:11px; height:11px; color:var(--accent)}

/* ============================================================
   GRID
   ============================================================ */
.grid{
  max-width:var(--max-w); margin:0 auto;
  padding:16px;
  display:grid; gap:14px;
  grid-template-columns:1fr;
  animation:fadeIn var(--t-base);
}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

/* ============================================================
   CARD
   ============================================================ */
.card{
  position:relative; overflow:hidden;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:16px;
  display:flex; flex-direction:column; gap:12px;
  cursor:pointer;
  transition:transform var(--t-base), border-color var(--t-base), box-shadow var(--t-base), background var(--t-base);
  -webkit-tap-highlight-color:transparent;
}
.card::before{
  content:""; position:absolute; inset:0;
  background:radial-gradient(600px circle at var(--mx,50%) var(--my,0%), var(--accent-soft), transparent 40%);
  opacity:0; transition:opacity var(--t-base);
  pointer-events:none;
}
.card:hover::before{opacity:1}
.card:hover{
  transform:translateY(-3px);
  border-color:var(--border-2);
  box-shadow:var(--shadow-md);
}
.card:active{transform:translateY(-1px) scale(.995)}

.card-head{display:flex; align-items:center; gap:12px; position:relative}
.card-icon{
  width:52px; height:52px; flex-shrink:0;
  border-radius:var(--r-md);
  display:grid; place-items:center; font-size:26px;
  background:linear-gradient(135deg,var(--accent-soft),var(--surface-2));
  border:1px solid var(--border-2);
  position:relative;
}
.card-icon .verified-dot{
  position:absolute; bottom:-3px; inset-inline-end:-3px;
  width:18px; height:18px; border-radius:50%;
  background:var(--success); color:#fff;
  display:grid; place-items:center;
  border:2px solid var(--surface);
}
.card-icon .verified-dot svg{width:10px; height:10px}
.card-titles{min-width:0; flex:1; padding-inline-end:36px}
.card-name{
  font-size:var(--fs-md); font-weight:700;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  display:flex; align-items:center; gap:6px;
}
.card-dev{
  font-size:var(--fs-xs); color:var(--text-mute);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  display:flex; align-items:center; gap:5px;
}
.card-dev .official-badge{
  display:inline-flex; align-items:center; gap:3px;
  padding:1px 6px; border-radius:var(--r-full);
  background:var(--info-soft); color:var(--info);
  font-size:9.5px; font-weight:600;
}
.card-tagline{
  font-size:var(--fs-sm); color:var(--text-dim);
  line-height:1.65; margin:0;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; min-height:2.7em;
}
.card-rating{
  display:flex; align-items:center; gap:6px;
  font-size:var(--fs-xs); color:var(--text-dim);
}
.stars{
  display:inline-flex; gap:1px; color:var(--warning);
}
.stars svg{width:11px; height:11px; fill:currentColor}
.card-foot{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  margin-top:auto; padding-top:12px;
  border-top:1px solid var(--border);
}
.meta-pill{
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 9px; border-radius:var(--r-full);
  background:var(--surface-2); border:1px solid var(--border);
  font-size:10.5px; color:var(--text-dim); font-weight:500;
  white-space:nowrap;
}
.meta-pill svg{width:10px; height:10px; flex-shrink:0}
.meta-pill.accent{
  color:var(--accent);
  border-color:color-mix(in srgb,var(--accent) 35%,var(--border));
  background:var(--accent-soft);
}
.meta-pill.success{
  color:var(--success);
  border-color:color-mix(in srgb,var(--success) 35%,var(--border));
  background:var(--success-soft);
}
.meta-pill.warning{
  color:var(--warning);
  border-color:color-mix(in srgb,var(--warning) 35%,var(--border));
  background:var(--warning-soft);
}

.fav-btn{
  position:absolute; top:12px; inset-inline-end:12px;
  width:34px; height:34px;
  display:grid; place-items:center;
  border-radius:var(--r-full);
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:1px solid var(--border);
  color:var(--text-mute); cursor:pointer;
  transition:all var(--t-fast); z-index:2;
  -webkit-tap-highlight-color:transparent;
}
.fav-btn:hover{color:var(--accent); border-color:var(--accent); transform:scale(1.08)}
.fav-btn:active{transform:scale(.92)}
.fav-btn.active{
  color:var(--accent);
  background:var(--accent-soft);
  border-color:var(--accent);
}
.fav-btn.active svg{fill:currentColor}
.fav-btn svg{width:15px; height:15px}

/* ============================================================
   DETAILS PAGE
   ============================================================ */
.details{
  max-width:960px; margin:0 auto; padding:16px;
  padding-bottom:calc(80px + var(--safe-bottom));
  animation:fadeIn var(--t-base);
}
.back-btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:8px 14px; border-radius:var(--r-full);
  background:var(--surface); border:1px solid var(--border);
  color:var(--text-dim); cursor:pointer;
  font:inherit; font-size:var(--fs-sm); font-weight:500;
  transition:all var(--t-base); margin-bottom:16px;
  -webkit-tap-highlight-color:transparent;
}
.back-btn:hover{
  color:var(--text); border-color:var(--border-2);
  background:var(--surface-2); transform:translateX(2px);
}
.back-btn svg{width:14px; height:14px}

/* Hero */
.details-hero{
  display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap;
  padding:20px; border-radius:var(--r-xl);
  background:linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid var(--border);
  position:relative; overflow:hidden;
}
.details-hero::before{
  content:""; position:absolute;
  top:-50%; inset-inline-end:-20%;
  width:400px; height:400px;
  background:radial-gradient(circle,var(--accent-soft),transparent 70%);
  pointer-events:none;
}
.details-icon{
  width:88px; height:88px; border-radius:var(--r-xl);
  flex-shrink:0;
  display:grid; place-items:center; font-size:44px;
  background:linear-gradient(135deg,var(--accent-soft),var(--surface-2));
  border:1px solid var(--border-2);
  position:relative; z-index:1;
  box-shadow:var(--shadow-sm);
}
.details-titles{flex:1; min-width:220px; position:relative; z-index:1}
.details-name{
  font-size:var(--fs-2xl); font-weight:800;
  margin:0 0 4px; line-height:1.3;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}
.details-name .verified-chip{
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 10px; border-radius:var(--r-full);
  background:var(--success-soft); color:var(--success);
  font-size:var(--fs-xs); font-weight:600;
}
.details-name .verified-chip svg{width:11px; height:11px}
.details-dev{
  font-size:var(--fs-sm); color:var(--text-mute);
  margin-bottom:10px;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}
.details-tagline{
  font-size:var(--fs-base); color:var(--text-dim);
  line-height:1.75; margin:0;
}
.details-actions{
  display:flex; gap:8px; flex-wrap:wrap; margin-top:16px;
  position:relative; z-index:1;
}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 20px; border-radius:var(--r-full);
  font:inherit; font-size:var(--fs-sm); font-weight:600;
  cursor:pointer;
  border:1px solid transparent;
  transition:all var(--t-base);
  white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
  min-height:42px;
}
.btn svg{width:15px; height:15px; flex-shrink:0}
.btn-primary{
  background:var(--accent); color:var(--accent-fg);
  box-shadow:0 4px 14px var(--accent-glow);
}
.btn-primary:hover{
  background:var(--accent-h);
  transform:translateY(-2px);
  box-shadow:0 8px 24px var(--accent-glow);
}
.btn-primary:active{transform:translateY(0) scale(.98)}
.btn-secondary{
  background:var(--surface-2); border-color:var(--border-2);
  color:var(--text);
}
.btn-secondary:hover{
  border-color:var(--border-strong);
  background:var(--surface-3);
  transform:translateY(-1px);
}
.btn-ghost{
  background:transparent; color:var(--text-dim);
  border-color:var(--border);
}
.btn-ghost:hover{
  color:var(--text); border-color:var(--border-2);
  background:var(--surface-2);
}
.btn-block{width:100%}

/* Sections */
.section{margin-top:28px}
.section-title{
  font-size:var(--fs-md); font-weight:700;
  margin:0 0 14px;
  display:flex; align-items:center; gap:8px;
}
.section-title svg{width:17px; height:17px; color:var(--accent)}

/* Meta grid */
.meta-grid{
  display:grid; gap:10px;
  grid-template-columns:repeat(2,1fr);
}
.meta-card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-md); padding:12px 14px;
  transition:border-color var(--t-fast), background var(--t-fast);
}
.meta-card:hover{border-color:var(--border-2); background:var(--surface-2)}
.meta-label{
  font-size:var(--fs-xs); color:var(--text-mute);
  margin-bottom:5px; display:flex; align-items:center; gap:5px;
}
.meta-label svg{width:11px; height:11px}
.meta-value{
  font-size:var(--fs-base); font-weight:700;
  color:var(--text); word-break:break-word;
}
.meta-value.mono{
  font-family:"JetBrains Mono",monospace;
  font-size:var(--fs-xs); font-weight:500;
  color:var(--text-dim);
  word-break:break-all;
  line-height:1.6;
}

/* Features */
.features{list-style:none; padding:0; margin:0; display:grid; gap:8px}
.features li{
  display:flex; gap:10px; align-items:flex-start;
  padding:11px 14px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-md);
  font-size:var(--fs-sm); color:var(--text-dim);
  line-height:1.6;
  transition:border-color var(--t-fast), background var(--t-fast);
}
.features li:hover{border-color:var(--border-2); background:var(--surface-2)}
.features li::before{
  content:""; flex-shrink:0; width:18px; height:18px;
  border-radius:50%; margin-top:2px;
  background-color:var(--success-soft);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234ADE80' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6L9 17l-5-5'/></svg>");
  background-size:12px; background-position:center; background-repeat:no-repeat;
}

/* Screenshots */
.screenshots{
  display:flex; gap:10px; overflow-x:auto;
  padding-bottom:8px;
  scroll-snap-type:x mandatory;
  scrollbar-width:thin;
}
.screenshot{
  flex-shrink:0;
  width:180px; height:320px;
  border-radius:var(--r-lg);
  border:1px solid var(--border-2);
  background:linear-gradient(160deg,var(--surface-2),var(--surface-3));
  display:grid; place-items:center;
  scroll-snap-align:start;
  position:relative; overflow:hidden;
  transition:transform var(--t-base), border-color var(--t-base);
}
.screenshot:hover{transform:scale(1.02); border-color:var(--accent)}
.screenshot::after{
  content:attr(data-label);
  position:absolute; bottom:10px; inset-inline-start:10px;
  font-size:var(--fs-xs); color:var(--text-mute);
  background:color-mix(in srgb,var(--bg) 75%,transparent);
  padding:3px 9px; border-radius:var(--r-full);
  backdrop-filter:blur(8px);
}
.screenshot-emoji{font-size:56px; opacity:.6}

/* Changelog */
.changelog{display:grid; gap:10px}
.changelog-item{
  padding:14px 16px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-md);
  border-inline-start:3px solid var(--accent);
}
.changelog-head{
  display:flex; align-items:center; gap:10px;
  margin-bottom:8px; flex-wrap:wrap;
}
.changelog-ver{
  font-size:var(--fs-sm); font-weight:700;
  color:var(--accent);
  font-family:"JetBrains Mono",monospace;
}
.changelog-date{font-size:var(--fs-xs); color:var(--text-mute)}
.changelog-tag{
  font-size:10px; padding:2px 8px;
  border-radius:var(--r-full);
  background:var(--accent-soft); color:var(--accent);
  font-weight:600;
}
.changelog-list{
  list-style:none; padding:0; margin:0;
  display:grid; gap:6px;
}
.changelog-list li{
  font-size:var(--fs-sm); color:var(--text-dim);
  padding-inline-start:16px; position:relative;
  line-height:1.6;
}
.changelog-list li::before{
  content:""; position:absolute;
  inset-inline-start:0; top:10px;
  width:6px; height:6px; border-radius:50%;
  background:var(--text-mute);
}

/* Downloads */
.downloads{display:grid; gap:8px}
.dl-row{
  display:flex; align-items:center; gap:12px;
  padding:12px 14px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-md);
  transition:border-color var(--t-fast), background var(--t-fast);
  flex-wrap:wrap;
}
.dl-row:hover{border-color:var(--border-2); background:var(--surface-2)}
.dl-icon{
  width:40px; height:40px; flex-shrink:0;
  border-radius:var(--r-sm);
  display:grid; place-items:center;
  background:var(--accent-soft);
  border:1px solid var(--border);
  color:var(--accent);
}
.dl-icon svg{width:18px; height:18px}
.dl-info{flex:1; min-width:180px}
.dl-name{
  font-size:var(--fs-sm); font-weight:600;
  color:var(--text); margin-bottom:4px;
  word-break:break-all;
}
.dl-meta{
  font-size:var(--fs-xs); color:var(--text-mute);
  display:flex; gap:10px; flex-wrap:wrap;
}
.dl-meta span{display:inline-flex; align-items:center; gap:4px}
.dl-meta svg{width:10px; height:10px}
.dl-badge{
  display:inline-flex; align-items:center; gap:4px;
  font-size:10px; font-weight:600;
  padding:3px 9px; border-radius:var(--r-full);
}
.dl-badge.verified{background:var(--success-soft); color:var(--success)}
.dl-badge.unverified{background:var(--warning-soft); color:var(--warning)}
.dl-badge svg{width:10px; height:10px}

/* Permissions */
.permissions{display:flex; flex-wrap:wrap; gap:6px}
.perm-chip{
  display:inline-flex; align-items:center; gap:5px;
  padding:5px 11px; border-radius:var(--r-full);
  background:var(--surface-2); border:1px solid var(--border);
  font-size:var(--fs-xs); color:var(--text-dim);
}
.perm-chip svg{width:11px; height:11px; color:var(--warning)}

/* Tags */
.tags-row{display:flex; gap:7px; flex-wrap:wrap}
.tag-chip{
  padding:5px 12px; border-radius:var(--r-full);
  background:var(--surface-2); border:1px solid var(--border);
  color:var(--text-dim);
  font-size:var(--fs-xs); font-weight:500;
  transition:all var(--t-fast);
  cursor:pointer;
}
.tag-chip:hover{
  color:var(--accent); border-color:var(--accent);
  background:var(--accent-soft);
}

/* Info box */
.info-box{
  display:flex; gap:10px; align-items:flex-start;
  padding:12px 14px;
  background:var(--info-soft);
  border:1px solid color-mix(in srgb,var(--info) 30%,transparent);
  border-radius:var(--r-md);
  font-size:var(--fs-sm); color:var(--text-dim);
  line-height:1.6;
}
.info-box svg{width:16px; height:16px; color:var(--info); flex-shrink:0; margin-top:3px}

/* ============================================================
   EMPTY / SKELETON
   ============================================================ */
.empty{
  text-align:center; padding:60px 20px;
  color:var(--text-mute);
  max-width:var(--max-w); margin:0 auto;
}
.empty-icon{
  width:64px; height:64px; margin:0 auto 16px;
  border-radius:var(--r-xl);
  background:var(--surface-2);
  display:grid; place-items:center;
  color:var(--text-mute);
}
.empty-icon svg{width:28px; height:28px}
.empty h3{
  margin:0 0 6px; color:var(--text-dim);
  font-weight:700; font-size:var(--fs-md);
}
.empty p{margin:0; font-size:var(--fs-sm); max-width:360px; margin-inline:auto}

.skeleton{
  background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite linear;
  border-radius:var(--r-sm);
}
@keyframes shimmer{to{background-position:-200% 0}}

/* ============================================================
   MOBILE BOTTOM NAV
   ============================================================ */
.bottom-nav{
  display:none;
  position:fixed; bottom:0; inset-inline:0;
  z-index:55;
  background:color-mix(in srgb,var(--bg-elev) 92%,transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--border);
  padding:8px 12px calc(8px + var(--safe-bottom));
  grid-template-columns:repeat(4,1fr);
  gap:4px;
}
.nav-item{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 4px;
  background:transparent; border:0;
  color:var(--text-mute);
  cursor:pointer; font:inherit;
  font-size:10.5px; font-weight:500;
  border-radius:var(--r-md);
  transition:all var(--t-fast);
  -webkit-tap-highlight-color:transparent;
  position:relative;
}
.nav-item svg{width:22px; height:22px}
.nav-item:active{transform:scale(.94)}
.nav-item.active{
  color:var(--accent);
  background:var(--accent-soft);
}
.nav-item .badge{
  position:absolute; top:2px; inset-inline-end:calc(50% - 18px);
  min-width:16px; height:16px; padding:0 4px;
  background:var(--accent); color:var(--accent-fg);
  border-radius:var(--r-full);
  font-size:9px; font-weight:700;
  display:grid; place-items:center;
}

/* ============================================================
   FILTER SHEET (mobile)
   ============================================================ */
.sheet-backdrop{
  position:fixed; inset:0; z-index:80;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  opacity:0; pointer-events:none;
  transition:opacity var(--t-base);
}
.sheet-backdrop.open{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; bottom:0; inset-inline:0;
  z-index:90;
  background:var(--bg-elev);
  border-top-left-radius:var(--r-2xl);
  border-top-right-radius:var(--r-2xl);
  border-top:1px solid var(--border);
  padding:8px 20px calc(24px + var(--safe-bottom));
  transform:translateY(100%);
  transition:transform var(--t-slow);
  max-height:85vh; overflow-y:auto;
}
.sheet.open{transform:translateY(0)}
.sheet-handle{
  width:40px; height:4px; margin:8px auto 16px;
  background:var(--border-strong);
  border-radius:var(--r-full);
}
.sheet-title{
  font-size:var(--fs-md); font-weight:700;
  margin:0 0 16px;
}
.sheet-group{margin-bottom:20px}
.sheet-label{
  font-size:var(--fs-xs); font-weight:600;
  color:var(--text-mute); margin-bottom:8px;
  text-transform:uppercase; letter-spacing:.5px;
}
.sheet-options{display:flex; flex-wrap:wrap; gap:8px}
.sheet-opt{
  padding:8px 14px; border-radius:var(--r-full);
  background:var(--surface); border:1px solid var(--border);
  color:var(--text-dim); cursor:pointer;
  font:inherit; font-size:var(--fs-sm); font-weight:500;
  transition:all var(--t-fast);
}
.sheet-opt.active{
  background:var(--accent); border-color:var(--accent);
  color:var(--accent-fg);
}

/* ============================================================
   TOAST
   ============================================================ */
.toast-wrap{
  position:fixed;
  bottom:calc(80px + var(--safe-bottom));
  inset-inline-start:16px; inset-inline-end:16px;
  z-index:200;
  display:flex; flex-direction:column; gap:8px;
  pointer-events:none;
  align-items:center;
}
.toast{
  padding:11px 18px;
  border-radius:var(--r-full);
  background:var(--surface-3);
  border:1px solid var(--border-2);
  color:var(--text);
  font-size:var(--fs-sm); font-weight:500;
  box-shadow:var(--shadow-lg);
  animation:toastIn var(--t-base);
  pointer-events:auto;
  max-width:100%;
  display:flex; align-items:center; gap:8px;
}
.toast svg{width:15px; height:15px; flex-shrink:0}
.toast.error{border-color:color-mix(in srgb,var(--danger) 50%,var(--border))}
.toast.error svg{color:var(--danger)}
.toast.success{border-color:color-mix(in srgb,var(--success) 50%,var(--border))}
.toast.success svg{color:var(--success)}
.toast.info svg{color:var(--info)}
@keyframes toastIn{
  from{opacity:0; transform:translateY(16px) scale(.96)}
  to{opacity:1; transform:none}
}

/* ============================================================
   RESPONSIVE — Tablet
   ============================================================ */
@media (min-width:640px){
  .logo-text{display:inline}
  .grid{
    grid-template-columns:repeat(2,1fr);
    padding:20px;
    gap:16px;
  }
  .meta-grid{grid-template-columns:repeat(3,1fr)}
  .header-inner{padding:12px 20px}
  .toolbar{padding:16px 20px 4px}
  .stats-bar{padding:8px 20px 0}
  .details{padding:20px}
  .details-icon{width:96px; height:96px; font-size:48px}
  .details-name{font-size:var(--fs-3xl)}
  .toast-wrap{
    inset-inline-start:auto; inset-inline-end:20px;
    align-items:flex-end;
    bottom:20px;
  }
}

/* ============================================================
   RESPONSIVE — Desktop
   ============================================================ */
@media (min-width:900px){
  .grid{
    grid-template-columns:repeat(3,1fr);
    padding:24px 20px 60px;
    gap:18px;
  }
  .meta-grid{grid-template-columns:repeat(3,1fr)}
  .details-hero{padding:28px; gap:24px}
  .details-icon{width:112px; height:112px; font-size:56px; border-radius:var(--r-2xl)}
  .details-name{font-size:32px}
  .details-actions .btn{padding:11px 22px}
}

@media (min-width:1100px){
  .grid{grid-template-columns:repeat(4,1fr)}
  .meta-grid{grid-template-columns:repeat(4,1fr)}
}

/* ============================================================
   RESPONSIVE — Mobile
   ============================================================ */
@media (max-width:639px){
  .bottom-nav{display:grid}
  .card-titles{padding-inline-end:0}
  .card .fav-btn{top:auto; bottom:12px; inset-inline-end:12px}
  .card-foot{padding-inline-end:44px}
  .details{padding-bottom:calc(80px + var(--safe-bottom))}
  .details-hero{padding:16px; gap:14px}
  .details-icon{width:68px; height:68px; font-size:34px; border-radius:var(--r-lg)}
  .details-name{font-size:var(--fs-xl)}
  .details-actions{width:100%}
  .details-actions .btn{flex:1; min-width:0}
  .details-actions .btn span{display:none}
  .details-actions .btn.btn-primary span,
  .details-actions .btn.btn-secondary span{display:inline}
  .meta-grid{grid-template-columns:repeat(2,1fr)}
  .screenshot{width:150px; height:270px}
  .toolbar select.chip{display:none}
  .filter-btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 14px; border-radius:var(--r-full);
    background:var(--surface); border:1px solid var(--border);
    color:var(--text-dim); cursor:pointer;
    font:inherit; font-size:var(--fs-sm); font-weight:500;
    flex-shrink:0;
  }
  .filter-btn svg{width:14px; height:14px}
  .filter-btn .count{
    min-width:18px; height:18px; padding:0 5px;
    background:var(--accent); color:var(--accent-fg);
    border-radius:var(--r-full);
    font-size:10px; font-weight:700;
    display:grid; place-items:center;
  }
  .filter-btn .count:empty{display:none}
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}
</style>

  {

function loadJSON(k, fb){
  try { const v = JSON.parse(localStorage.getItem(k)); return v ?? fb; }
  catch { return fb; }
}
function saveJSON(k, v){
  try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
}

/* ============================================================
   4) UTILS
   ============================================================ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

function fmtDate(iso){
  if (!iso) return '—';
  try {
    return new Intl.DateTimeFormat('fa-IR', {
      year:'numeric', month:'short', day:'numeric'
    }).format(new Date(iso));
  } catch { return iso; }
}
function fmtNumber(n){
  if (n == null) return '—';
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/,'') + 'M';
  if (n >= 1_000) return (n / 1_000).toFixed(1).replace(/\.0$/,'') + 'K';
  return String(n);
}
function formatBytes(b){
  if (b == null) return '';
  const u = ['B','KB','MB','GB'];
  let i = 0, n = b;
  while (n >= 1024 && i < u.length - 1){ n /= 1024; i++; }
  const d = n < 10 && i > 0 ? 1 : 0;
  return `${n.toFixed(d)} ${u[i]}`;
}
function parseArch(name){
  const s = String(name).toLowerCase();
  if (/arm64|aarch64/.test(s)) return 'arm64-v8a';
  if (/armeabi|armv7/.test(s)) return 'armeabi-v7a';
  if (/x86_64/.test(s))        return 'x86_64';
  if (/\bx86\b/.test(s))       return 'x86';
  if (/universal/.test(s))     return 'universal';
  return '';
}
function compareVersions(a, b){
  const pa = String(a).split(/[.\-+_]/).map(x => /^\d+$/.test(x) ? +x : x);
  const pb = String(b).split(/[.\-+_]/).map(x => /^\d+$/.test(x) ? +x : x);
  const len = Math.max(pa.length, pb.length);
  for (let i = 0; i < len; i++){
    const x = pa[i] ?? 0, y = pb[i] ?? 0;
    if (x === y) continue;
    return x > y ? 1 : -1;
  }
  return 0;
}
const catLabel = id => CATEGORIES.find(c => c.id === id)?.label || id;
const archLabel = id => ARCHS.find(a => a.id === id)?.label || id;

function starsHTML(rating){
  const full = Math.floor(rating);
  const half = rating - full >= 0.5;
  let html = '';
  for (let i = 0; i < 5; i++){
    if (i < full) html += ICONS.star_fill;
    else if (i === full && half) html += ICONS.star_fill;
    else html += `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
  }
  return `<span class="stars">${html}</span>`;
}

/* ============================================================
   6) GITHUB RELEASES
   ============================================================ */
const releaseCache = new Map();
const RELEASE_TTL = 60 * 60 * 1000;

async function getLatestRelease(repo){
  if (!repo) return null;
  if (releaseCache.has(repo)) return releaseCache.get(repo);

  const key = `spaedr:rel:${repo}`;
  const cached = loadJSON(key, null);
  if (cached && Date.now() - cached.ts < RELEASE_TTL){
    releaseCache.set(repo, cached.data);
    return cached.data;
  }

  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 8000);
    const res = await fetch(`https://api.github.com/repos/${repo}/releases/latest`, {
      headers:{ 'Accept':'application/vnd.github+json' },
      signal:controller.signal,
    });
    clearTimeout(timer);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    releaseCache.set(repo, data);
    saveJSON(key, { ts:Date.now(), data });
    return data;
  } catch {
    return null;
  }
}

/* ============================================================
   7) DOWNLOADS
   ============================================================ */
function buildDownloads(app, release){
  const list = [];

  if (release && Array.isArray(release.assets)){
    for (const a of release.assets){
      if (/\.(apk|exe|dmg|zip|tar\.gz|deb|rpm|apks|aab)$/i.test(a.name) ||
          !/\.(sha|sig|txt|md|json)$/i.test(a.name)) {
        list.push({
          name: a.name,
          url: a.browser_download_url,
          size: formatBytes(a.size),
          arch: parseArch(a.name),
          source: 'GitHub Releases',
          verified: true,
        });
      }
    }
  }

  if (!list.length && app.repo){
    list.push({
      name:'صفحه رسمی Releases',
      url:`https://github.com/${app.repo}/releases`,
      size:'', arch:'', source:'GitHub', verified:false,
    });
  }
  if (!list.length && app.homepage){
    list.push({
      name:'صفحه رسمی برنامه',
      url:app.homepage,
      size:'', arch:'', source:'وب‌سایت رسمی', verified:false,
    });
  }
  return list;
}

/* ============================================================
   8) FILTER / SORT
   ============================================================ */
function filterApps(){
  const q = state.search.trim().toLowerCase();
  let list = APPS.filter(a => {
    if (state.category !== 'all' && a.category !== state.category) return false;
    if (state.arch !== 'all' && !a.architectures.includes(state.arch)) return false;
    if (q){
      const hay = [
        a.name, a.developer, a.tagline, a.description,
        a.longDescription, a.tags.join(' ')
      ].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  switch (state.sort){
    case 'newest':
      list.sort((a,b) => (b.releasedAt||'').localeCompare(a.releasedAt||''));
      break;
    case 'name':
      list.sort((a,b) => a.name.localeCompare(b.name, 'fa'));
      break;
    case 'rating':
      list.sort((a,b) => (b.rating||0) - (a.rating||0));
      break;
    case 'fav':
      list = list.filter(a => state.favorites.has(a.id));
      break;
    case 'featured':
    default:
      list.sort((a,b) => {
        const fa = state.favorites.has(a.id) ? 0 : 1;
        const fb = state.favorites.has(b.id) ? 0 : 1;
        if (fa !== fb) return fa - fb;
        if (a.verified !== b.verified) return a.verified ? -1 : 1;
        return (b.rating||0) - (a.rating||0);
      });
  }
  return list;
}

function activeFilterCount(){
  let n = 0;
  if (state.category !== 'all') n++;
  if (state.arch !== 'all') n++;
  if (state.sort !== 'featured') n++;
  return n;
}

            </div>
          </div>
          <div class="meta-card">
            <div class="meta-label">${icon('shield')} حداقل سیستم</div>
            <div class="meta-value" style="font-size:var(--fs-sm)">${esc(app.minOS)}</div>
          </div>
          <div class="meta-card">
            <div class="meta-label">${icon('file')} مجوز</div>
            <div class="meta-value" style="font-size:var(--fs-sm)">${esc(app.license)}</div>
          </div>
          <div class="meta-card">
            <div class="meta-label">${icon('star')} امتیاز</div>
            <div class="meta-value" style="display:flex;align-items:center;gap:6px">
              ${a_rating(app.rating, app.ratingCount)}
            </div>
          </div>
          <div class="meta-card">
            <div class="meta-label">${icon('download')} دانلودها</div>
            <div class="meta-value">${fmtNumber(app.downloads)}</div>
          </div>
          <div class="meta-card">
            <div class="meta-label">${icon('globe')} زبان‌ها</div>
            <div class="meta-value" style="font-size:var(--fs-xs)">${app.languages.map(esc).join(' • ')}</div>
          </div>
          <div class="meta-card">
            <div class="meta-label">${icon('gift')} قیمت</div>
            <div class="meta-value" style="font-size:var(--fs-sm)">
              ${app.pricing === 'free' ? 'رایگان' : app.pricing === 'paid' ? 'پرداختی' : 'رایگان + درون‌برنامه‌ای'}
            </div>
          </div>
        </div>
      </section>

      ${app.screenshots && app.screenshots.length ? `
        <section class="section">
          <h2 class="section-title">${icon('image')} تصاویر</h2>
          <div class="screenshots">
            ${app.screenshots.map(s => `
              <div class="screenshot" data-label="${esc(s.label)}">
                <span class="screenshot-emoji">${esc(s.emoji)}</span>
              </div>
            `).join('')}
          </div>
        </section>
      ` : ''}

      <section class="section">
        <h2 class="section-title">${icon('check')} ویژگی‌ها</h2>
        <ul class="features">
          ${app.features.map(f => `<li>${esc(f)}</li>`).join('')}
        </ul>
      </section>

      ${app.changelog && app.changelog.length ? `
        <section class="section">
          <h2 class="section-title">${icon('clock')} تغییرات نسخه‌ها</h2>
          <div class="changelog">
            ${app.changelog.map(c => `
              <div class="changelog-item">
                <div class="changelog-head">
                  <span class="changelog-ver">v${esc(c.version)}</span>
                  ${c.tag ? `<span class="changelog-tag">${esc(c.tag)}</span>` : ''}
                  <span class="changelog-date">${fmtDate(c.date)}</span>
                </div>
                <ul class="changelog-list">
                  ${c.changes.map(ch => `<li>${esc(ch)}</li>`).join('')}
                </ul>
              </div>
            `).join('')}
          </div>
        </section>
      ` : ''}

      <section class="section">
        <h2 class="section-title">${icon('download')} فایل‌های دانلود</h2>
        <div class="downloads">
          ${downloads.length
            ? downloads.map(renderDownload).join('')
            : `<div class="meta-card" style="text-align:center;color:var(--text-mute)">
                 فایل قابل دانلود مستقیمی ثبت نشده است.
               </div>`}
        </div>
      </section>

      ${app.permissions && app.permissions.length ? `
        <section class="section">
          <h2 class="section-title">${icon('lock')} دسترسی‌ها</h2>
          <div class="permissions">
            ${app.permissions.map(p => `
              <span class="perm-chip">${icon('alert')} ${esc(p)}</span>
            `).join('')}
          </div>
        </section>
      ` : ''}

      <section class="section">
        <h2 class="section-title">${icon('tag')} برچسب‌ها</h2>
        <div class="tags-row">
          ${app.tags.map(t => `<span class="tag-chip" data-tag="${esc(t)}">#${esc(t)}</span>`).join('')}
        </div>
      </section>
    </div>
  `;

  document.getElementById('backBtn').addEventListener('click', closeDetails);
  document.getElementById('favBtn').addEventListener('click', () => {
    toggleFav(app.id);
    const now = state.favorites.has(app.id);
    const btn = document.getElementById('favBtn');
    btn.innerHTML = `${icon('heart')} <span>${now ? 'ذخیره‌شده' : 'ذخیره'}</span>`;
    btn.setAttribute('aria-pressed', String(now));
    toast(now ? 'به علاقه‌مندی‌ها اضافه شد' : 'از علاقه‌مندی‌ها حذف شد', 'success', 1600);
    updateFavBadge();
  });

  document.querySelectorAll('[data-tag]').forEach(el => {
    el.addEventListener('click', () => {
      state.search = el.dataset.tag;
      state.category = 'all';
      const inp = document.getElementById('search');
      inp.value = el.dataset.tag;
      document.getElementById('searchWrap').classList.add('has-value');
      goStore();
    });
  });
}

function a_rating(r, count){
  return `${starsHTML(r)}<strong style="color:var(--text)">${r.toFixed(1)}</strong>
          <span style="color:var(--text-mute);font-size:var(--fs-xs)">(${fmtNumber(count)})</span>`;
}

function renderDownload(d){
  return `
    <div class="dl-row">
      <div class="dl-icon" aria-hidden="true">${icon('download')}</div>
      <div class="dl-info">
        <div class="dl-name">${esc(d.name)}</div>
        <div class="dl-meta">
          ${d.arch   ? `<span>${icon('cpu')} ${esc(d.arch)}</span>` : ''}
          ${d.size   ? `<span>${icon('hdd')} ${esc(d.size)}</span>` : ''}
          ${d.source ? `<span>${icon('globe')} ${esc(d.source)}</span>` : ''}
        </div>
      </div>
      <span class="dl-badge ${d.verified ? 'verified' : 'unverified'}">
        ${d.verified ? icon('check') + ' تأییدشده' : icon('alert') + ' تأییدنشده'}
      </span>
      <a class="btn btn-secondary" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">
        ${icon('download')} دریافت
      </a>
    </div>
  `;
}

/* ============================================================
   12) ROUTING
   ============================================================ */
function openApp(id){
  const url = new URL(location.href);
  url.searchParams.set('app', id);
  history.pushState({ view:'details', id }, '', url);
  renderRoute();
}

function goStore(){
  const url = new URL(location.href);
  url.searchParams.delete('app');
  history.pushState({ view:'store' }, '', url);
  renderRoute();
}

function closeDetails(){
  history.back();
}

function renderRoute(){
  const appId = new URL(location.href).searchParams.get('app');
  const app = appId ? APPS.find(a => a.id === appId) : null;

  if (app){
    state.currentApp = app;
    document.title = `${app.name} — SpaedrNG`;
    renderDetails(app);
  } else {
    state.currentApp = null;
    document.title = 'SpaedrNG — فروشگاه نرم‌افزار';
    renderStore();
  }
  window.scrollTo({ top:0, behavior:'auto' });
}

/* ============================================================
   13) THEME
   ============================================================ */
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  const meta = document.getElementById('metaTheme');
  if (meta) meta.content = t === 'light' ? '#F5F7FB' : '#0B0E14';
  const btn = document.getElementById('themeBtn');
  if (btn){
    btn.innerHTML = t === 'light' ? icon('moon') : icon('sun');
    btn.setAttribute('aria-label', t === 'light' ? 'فعال‌سازی تم تیره' : 'فعال‌سازی تم روشن');
  }
}

function toggleFav(id){
  if (state.favorites.has(id)) state.favorites.delete(id);
  else state.favorites.add(id);
  saveFavs();
}

function updateFavBadge(){
  const badge = document.getElementById('favBadge');
  const n = state.favorites.size;
  if (n > 0){
    badge.textContent = n > 99 ? '99+' : String(n);
    badge.style.display = 'grid';
  } else {
    badge.style.display = 'none';
  }
}

/* ============================================================
   14) FILTER SHEET
   ============================================================ */
function openFilterSheet(){
  const sheet = document.getElementById('filterSheet');
  const backdrop = document.getElementById('sheetBackdrop');

  const catBox = document.getElementById('sheetCategories');
  catBox.innerHTML = CATEGORIES.map(c => `
    <button class="sheet-opt ${state.category === c.id ? 'active' : ''}" data-cat="${esc(c.id)}">
      ${esc(c.label)}
    </button>
  `).join('');

  const archBox = document.getElementById('sheetArch');
  archBox.innerHTML = ARCHS.map(a => `
    <button class="sheet-opt ${state.arch === a.id ? 'active' : ''}" data-arch="${esc(a.id)}">
      ${esc(a.label)}
    </button>
  `).join('');

  const sortBox = document.getElementById('sheetSort');
  sortBox.innerHTML = SORTS.map(s => `
    <button class="sheet-opt ${state.sort === s.id ? 'active' : ''}" data-sort="${esc(s.id)}">
      ${esc(s.label)}
    </button>
  `).join('');

  catBox.onclick = e => {
    const b = e.target.closest('[data-cat]'); if (!b) return;
    state.category = b.dataset.cat;
    catBox.querySelectorAll('.sheet-opt').forEach(x => x.classList.toggle('active', x === b));
  };
  archBox.onclick = e => {
    const b = e.target.closest('[data-arch]'); if (!b) return;
    state.arch = b.dataset.arch;
    archBox.querySelectorAll('.sheet-opt').forEach(x => x.classList.toggle('active', x === b));
  };
  sortBox.onclick = e => {
    const b = e.target.closest('[data-sort]'); if (!b) return;
    state.sort = b.dataset.sort;
    sortBox.querySelectorAll('.sheet-opt').forEach(x => x.classList.toggle('active', x === b));
  };

  document.getElementById('sheetApply').onclick = () => {
    closeFilterSheet();
    renderStore();
  };

  sheet.classList.add('open');
  backdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeFilterSheet(){
  document.getElementById('filterSheet').classList.remove('open');
  document.getElementById('sheetBackdrop').classList.remove('open');
  document.body.style.overflow = '';
}

/* ============================================================
   15) PWA MANIFEST
   ============================================================ */
function setupManifest(){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0B0E14"/><text x="50%" y="54%" font-family="sans-serif" font-size="280" font-weight="800" fill="#C49A6C" text-anchor="middle" dominant-baseline="middle">S</text></svg>`;
  const iconUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));

  const manifest = {
    name: 'SpaedrNG',
    short_name: 'SpaedrNG',
    description: 'فروشگاه نرم‌افزارهای امن و متن‌باز',
    start_url: '.',
    scope: '.',
    display: 'standalone',
    background_color: '#0B0E14',
    theme_color: '#0B0E14',
    icons: [
      { src: iconUrl, sizes:'192x192', type:'image/svg+xml', purpose:'any maskable' },
      { src: iconUrl, sizes:'512x512', type:'image/svg+xml', purpose:'any maskable' },
    ],
  };
  try {
    const blob = new Blob([JSON.stringify(manifest)], { type:'application/manifest+json' });
    document.getElementById('manifest').href = URL.createObjectURL(blob);
  } catch {}
}

/* ============================================================
   16) INIT
   ============================================================ */
function init(){
  const savedTheme = localStorage.getItem('spaedr:theme');
  const prefersLight = window.matchMedia?.('(prefers-color-scheme: light)').matches;
  applyTheme(savedTheme || (prefersLight ? 'light' : 'dark'));

  document.getElementById('themeBtn').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    applyTheme(next);
    localStorage.setItem('spaedr:theme', next);
  });

  // Search
  const searchInput = document.getElementById('search');
  const searchWrap = document.getElementById('searchWrap');
  const searchClear = document.getElementById('searchClear');
  let searchTimer;

  searchInput.addEventListener('input', e => {
    clearTimeout(searchTimer);
    const v = e.target.value;
    searchWrap.classList.toggle('has-value', v.length > 0);
    searchTimer = setTimeout(() => {
      state.search = v;
      if (state.currentApp) goStore();
      else renderStore();
    }, 150);
  });

  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    state.search = '';
    searchWrap.classList.remove('has-value');
    renderStore();
    searchInput.focus();
  });

  // Fav toggle from header
  document.getElementById('favToggle').addEventListener('click', () => {
    state.sort = state.sort === 'fav' ? 'featured' : 'fav';
    state.category = 'all';
    goStore();
  });

  // Card + fav events
  document.addEventListener('click', e => {
    const favBtn = e.target.closest('[data-fav]');
    if (favBtn){
      e.stopPropagation();
      e.preventDefault();
      const id = favBtn.dataset.fav;
      toggleFav(id);
      favBtn.classList.toggle('active');
      toast(state.favorites.has(id) ? 'به علاقه‌مندی‌ها اضافه شد' : 'از علاقه‌مندی‌ها حذف شد', 'success', 1400);
      updateFavBadge();
      return;
    }
    const card = e.target.closest('.card');
    if (card){
      openApp(card.dataset.id);
    }
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ')){
      const card = e.target.closest?.('.card');
      if (card){ e.preventDefault(); openApp(card.dataset.id); }
    }
    if (e.key === 'Escape'){
      if (document.getElementById('filterSheet').classList.contains('open')){
        closeFilterSheet();
      } else if (state.currentApp){
        closeDetails();
      }
    }
  });

  // Bottom nav
  document.getElementById('bottomNav').addEventListener('click', e => {
    const item = e.target.closest('[data-nav]');
    if (!item) return;
    const nav = item.dataset.nav;

    document.querySelectorAll('.nav-item').forEach(x => x.classList.toggle('active', x === item));

    if (nav === 'home'){
      state.sort = 'featured';
      state.category = 'all';
      goStore();
    } else if (nav === 'new'){
      state.sort = 'newest';
      state.category = 'all';
      goStore();
    } else if (nav === 'fav'){
      state.sort = 'fav';
      state.category = 'all';
      goStore();
    } else if (nav === 'filter'){
      openFilterSheet();
    }
  });

  // Sheet close
  document.getElementById('sheetBackdrop').addEventListener('click', closeFilterSheet);

  // Card mouse tracking for glow effect
  document.addEventListener('mousemove', e => {
    const card = e.target.closest?.('.card');
    if (!card) return;
    const r = card.getBoundingClientRect();
    card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    card.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });

  // Deep link handling
  const initialApp = new URL(location.href).searchParams.get('app');
  if (initialApp && APPS.some(a => a.id === initialApp)){
    const cleanUrl = location.pathname + location.hash;
    history.replaceState({ view:'store' }, '', cleanUrl);
    history.pushState({ view:'details', id: initialApp }, '', location.href);
  }

  window.addEventListener('popstate', renderRoute);

  setupManifest();
  updateFavBadge();
  renderRoute();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
