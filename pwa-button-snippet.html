<!-- 1) این موارد را داخل <head> قالب سایت قرار بده: -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#080b12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EF3">
<link rel="icon" href="/pwa/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/pwa/icon.svg">

<!-- 2) این دکمه را در محل دلخواه قالب قرار بده: -->
<button type="button" data-ef3-install
  style="border:0;border-radius:12px;padding:11px 16px;background:#111827;color:#fff;font:600 14px system-ui;cursor:pointer">
  نصب اپ EF3
</button>

<!-- 3) این اسکریپت را قبل از بسته شدن </body> قرار بده: -->
<script src="/install.js" defer></script>

<!-- مهم: فایل‌های manifest.webmanifest، sw.js، install.js، offline.html و پوشه pwa
     باید روی همان دامنه‌ای میزبانی شوند که سایت از آن باز می‌شود. -->
